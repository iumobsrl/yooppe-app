name: Crea APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configura progetto (cartella android, permessi, icona)
        run: python3 tool/configura_piattaforme.py

      - name: Compila APK
        run: flutter build apk --release

      - name: Rinomina APK
        run: cp build/app/outputs/flutter-apk/app-release.apk yooppe.apk

      - name: Allega APK (download dalla pagina Actions)
        uses: actions/upload-artifact@v4
        with:
          name: yooppe-apk
          path: yooppe.apk

      - name: Pubblica APK in Releases (download diretto dal telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Yooppe build ${{ github.run_number }}
          body: APK di prova della demo Yooppe. Sul telefono tocca yooppe.apk per scaricarlo e installarlo.
          files: yooppe.apk
